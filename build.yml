name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek
        run: unzip -q m-jurnal.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: m-jurnal
      - uses: actions/upload-artifact@v4
        with:
          name: M-Jurnal-APK
          path: m-jurnal/app/build/outputs/apk/debug/app-debug.apk
